services:
  fund-tools:
    build: .
    container_name: fund-tools
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      FUND_ESTIMATOR_FORCE_MOCK: "0"
      FUND_ESTIMATOR_ALLOW_MOCK_FALLBACK: "0"
      FUND_ESTIMATOR_DB: /app/data/fund_estimator.sqlite3
      FUND_ESTIMATOR_BACKGROUND_SCAN: "0"
      FUND_ESTIMATOR_LOF_NOTICE_SCHEDULER: "1"
    volumes:
      - ./data:/app/data

  fund-tools-proxy:
    image: nginx:1.27-alpine
    container_name: fund-tools-proxy
    restart: unless-stopped
    depends_on:
      - fund-tools
    ports:
      - "18367:8443"
    volumes:
      - ./deploy/nginx/fund-tools.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs/letsencrypt:/etc/letsencrypt:ro
