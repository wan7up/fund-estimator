server {
    listen 8443 ssl;
    http2 on;
    server_name fund.mbl.dpdns.org;

    ssl_certificate /etc/letsencrypt/live/fund.mbl.dpdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fund.mbl.dpdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 20m;
    error_page 497 =301 https://$host$request_uri;

    location / {
        proxy_pass http://fund-tools:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
