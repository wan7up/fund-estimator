services:
  fund-tools:
    build: .
    container_name: fund-tools
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      FUND_ESTIMATOR_FORCE_MOCK: ${FUND_ESTIMATOR_FORCE_MOCK:-0}
      FUND_ESTIMATOR_ALLOW_MOCK_FALLBACK: ${FUND_ESTIMATOR_ALLOW_MOCK_FALLBACK:-0}
      FUND_ESTIMATOR_DB: /app/data/fund_estimator.sqlite3
      FUND_ESTIMATOR_BACKGROUND_SCAN: ${FUND_ESTIMATOR_BACKGROUND_SCAN:-0}
      FUND_ESTIMATOR_LOF_NOTICE_SCHEDULER: ${FUND_ESTIMATOR_LOF_NOTICE_SCHEDULER:-1}
      FUND_ESTIMATOR_COMPARE_AI_PASSWORD: ${FUND_ESTIMATOR_COMPARE_AI_PASSWORD:-}
      FUND_ESTIMATOR_AI_CHAT_PASSWORD: ${FUND_ESTIMATOR_AI_CHAT_PASSWORD:-}
      FUND_ESTIMATOR_AI_TRANSCRIPTION_MODEL: ${FUND_ESTIMATOR_AI_TRANSCRIPTION_MODEL:-whisper-1}
    volumes:
      - ./data:/app/data
